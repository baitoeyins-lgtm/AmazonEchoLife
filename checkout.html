<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งซื้อสินค้า - Amazon Echo Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(21, 28, 46, 0.85);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --text-main: #f0f4f8;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Itim', 'Mali', cursive, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 6%; background: rgba(8, 12, 20, 0.9); backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(0, 242, 254, 0.2);
        }

        .logo { font-size: 1.5rem; font-weight: bold; background: linear-gradient(45deg, var(--accent-cyan), var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Mali', cursive; }
        .nav-links { display: flex; gap: 1.2rem; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-sub); text-decoration: none; font-size: 1.05rem; }

        .btn-buy-nav {
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-blue)); color: #000 !important; font-weight: bold !important;
            padding: 0.5rem 1.2rem; border-radius: 20px; box-shadow: 0 0 12px rgba(0, 242, 254, 0.5);
        }

        .container { padding: 3rem 6%; max-width: 800px; margin: 0 auto; }
        
        .checkout-box {
            background: var(--card-bg); border-radius: 20px; padding: 2.5rem;
            border: 1px solid var(--accent-cyan); box-shadow: 0 10px 30px rgba(0, 242, 254, 0.2);
        }

        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.4rem; color: var(--accent-cyan); font-family: 'Mali', cursive; font-size: 1.1rem; }
        
        input, select, textarea {
            width: 100%; padding: 0.8rem; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.5); color: #fff; font-size: 1rem; transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0,242,254,0.4);
        }

        .btn-submit {
            width: 100%; padding: 0.9rem; background: linear-gradient(45deg, var(--accent-cyan), var(--accent-blue));
            color: #000; font-weight: bold; font-size: 1.2rem; border: none; border-radius: 12px; cursor: pointer;
            transition: 0.3s; margin-top: 1rem; font-family: 'Mali', cursive;
        }

        .btn-submit:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(0,242,254,0.6); }

        @media (max-width: 768px) {
            nav { flex-direction: column; gap: 0.8rem; padding: 1rem 4%; text-align: center; }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 0.8rem; }
            .container { padding: 1.5rem 4%; }
            .checkout-box { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AMAZON ECHO STORE 2026</div>
        <ul class="nav-links">
            <li><a href="index.html">หน้าแรก</a></li>
            <li><a href="tech-details.html">นวัตกรรม & สไลด์อ้างอิง</a></li>
            <li><a href="models-pricing.html">แคตตาล็อกสินค้า</a></li>
            <li><a href="checkout.html" class="btn-buy-nav">สั่งซื้อเลย</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="checkout-box">
            <h2 style="color: var(--accent-cyan); font-family: 'Mali', cursive; text-align: center; margin-bottom: 1.5rem; font-size: 1.8rem;">🛒 แบบฟอร์มสั่งซื้อสินค้า</h2>
            <form onsubmit="alert('ขอบคุณสำหรับคำสั่งซื้อ! เราจะรีบดำเนินการจัดส่งทันทีครับ'); return false;">
                <div class="form-group">
                    <label>เลือกรุ่น Amazon Echo ที่ต้องการ</label>
                    <select required>
                        <option value="sphere">Echo 2026 (Sphere Design) - ฿6,590</option>
                        <option value="cylinder">Amazon Echo 2026 Cylinder - ฿4,290</option>
                        <option value="show">Echo Show Series - ฿7,990</option>
                        <option value="dot">Echo Dot Compact - ฿2,190</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ชื่อ - นามสกุล ผู้รับสินค้า</label>
                    <input type="text" placeholder="ระบุชื่อและนามสกุล" required>
                </div>

                <div class="form-group">
                    <label>เบอร์โทรศัพท์ติดต่อ</label>
                    <input type="tel" placeholder="08X-XXX-XXXX" required>
                </div>

                <div class="form-group">
                    <label>ที่อยู่จัดส่งสินค้า</label>
                    <textarea rows="3" placeholder="ระบุที่อยู่สำหรับจัดส่งอย่างครบถ้วน" required></textarea>
                </div>

                <div class="form-group">
                    <label>ช่องทางชำระเงิน</label>
                    <select required>
                        <option value="qr">โอนผ่าน PromptPay QR Code</option>
                        <option value="card">บัตรเครดิต / เดบิต</option>
                        <option value="cod">เก็บเงินปลายทาง (COD)</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">ยืนยันการสั่งซื้อ</button>
            </form>
        </div>
    </div>

</body>
</html>
